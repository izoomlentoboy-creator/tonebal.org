name = "tonebal-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# После деплоя привяжите домен в Cloudflare Dashboard:
# Workers & Pages → tonebal-proxy → Settings → Domains & Routes
# Добавьте: tonebal.org/* и www.tonebal.org/*

# Или используйте routes:
# routes = [
#   { pattern = "tonebal.org/*", zone_name = "tonebal.org" },
#   { pattern = "www.tonebal.org/*", zone_name = "tonebal.org" }
# ]

[vars]
# Укажите ваш Vercel deployment URL (без custom domain)
# Например: tonebal-org.vercel.app или ваш project URL
VERCEL_ORIGIN = "https://tonebal-org.vercel.app"
